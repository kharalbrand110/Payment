<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok User Info Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #000 0%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        h1 span {
            color: #ff004f;
        }

        .sub {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            padding: 18px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.95);
            outline: none;
        }

        button {
            padding: 18px 40px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff004f, #ff6b6b);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255,0,79,0.3);
        }

        .loader {
            display: none;
            text-align: center;
            margin: 40px 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ff004f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .user-info {
            display: none;
            background: rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 30px;
            margin-top: 30px;
        }

        .profile-header {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff004f;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .stat {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #ff004f;
        }

        .stat-label {
            color: rgba(255,255,255,0.7);
            margin-top: 5px;
        }

        .info-row {
            margin: 15px 0;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            word-break: break-all;
        }

        .info-label {
            font-weight: bold;
            color: #ff004f;
        }

        .error {
            background: rgba(255,0,0,0.2);
            border: 1px solid #ff004f;
            padding: 15px;
            border-radius: 12px;
            color: #ff6b6b;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            .profile-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>TikTok <span>User Info</span> Viewer</h1>
            <p class="sub">Get user profile information, location, and more</p>

            <div class="input-group">
                <input type="text" id="username" placeholder="Enter TikTok username (e.g., tiktok)">
                <button onclick="getUserInfo()">🔍 Search</button>
            </div>

            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="color:white; margin-top:15px;">Fetching data...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="user-info" id="userInfo">
                <div class="profile-header">
                    <img class="avatar" id="avatar" src="" alt="Avatar">
                    <div>
                        <h2 style="color:white" id="displayName"></h2>
                        <p style="color:rgba(255,255,255,0.7)">@<span id="uniqueId"></span></p>
                        <p id="bio" style="color:rgba(255,255,255,0.8); margin-top:8px;"></p>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="followers">0</div>
                        <div class="stat-label">Followers</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="following">0</div>
                        <div class="stat-label">Following</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="likes">0</div>
                        <div class="stat-label">Total Likes</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="videos">0</div>
                        <div class="stat-label">Videos</div>
                    </div>
                </div>

                <div class="info-row">
                    <span class="info-label">📍 Location:</span>
                    <span id="location" style="color:white">Not available</span>
                </div>

                <div class="info-row">
                    <span class="info-label">📧 Email (if public):</span>
                    <span id="email" style="color:white">Not available</span>
                </div>

                <div class="info-row">
                    <span class="info-label">🔗 Profile Link:</span>
                    <a id="profileLink" href="#" target="_blank" style="color:#ff004f; text-decoration:none;">View on TikTok →</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // IMPORTANT: Replace with your Vercel backend URL after deployment
        const API_URL = window.location.origin + '/api/tiktok';

        async function getUserInfo() {
            const username = document.getElementById('username').value.trim();
            
            if (!username) {
                showError('Please enter a username');
                return;
            }

            // Hide previous results
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            try {
                const response = await fetch(`${API_URL}?username=${username}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch user data');
                }

                displayUserInfo(data);
            } catch (err) {
                // Demo mode - show sample data if API fails
                showDemoData(username);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function displayUserInfo(data) {
            document.getElementById('avatar').src = data.avatar || 'https://via.placeholder.com/100';
            document.getElementById('displayName').innerText = data.displayName || data.username;
            document.getElementById('uniqueId').innerText = data.username;
            document.getElementById('bio').innerText = data.bio || 'No bio available';
            document.getElementById('followers').innerText = data.followers?.toLocaleString() || '0';
            document.getElementById('following').innerText = data.following?.toLocaleString() || '0';
            document.getElementById('likes').innerText = data.likes?.toLocaleString() || '0';
            document.getElementById('videos').innerText = data.videos || '0';
            document.getElementById('location').innerText = data.location || 'Not available';
            document.getElementById('email').innerText = data.email || 'Not available';
            document.getElementById('profileLink').href = `https://tiktok.com/@${data.username}`;
            
            document.getElementById('userInfo').style.display = 'block';
        }

        function showDemoData(username) {
            // Demo data for presentation (TikTok API needs backend)
            const demoData = {
                username: username,
                displayName: username.charAt(0).toUpperCase() + username.slice(1),
                avatar: 'https://picsum.photos/100/100',
                bio: '🎵 Content creator | 🎥 Daily videos | ✨ 1M+ views',
                followers: Math.floor(Math.random() * 1000000) + 1000,
                following: Math.floor(Math.random() * 5000) + 100,
                likes: Math.floor(Math.random() * 5000000) + 10000,
                videos: Math.floor(Math.random() * 500) + 10,
                location: 'United States',
                email: `${username}@example.com`
            };
            displayUserInfo(demoData);
            showError('Demo mode: For real TikTok data, deploy backend with valid API keys', true);
        }

        function showError(msg, isWarning = false) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
            if (isWarning) {
                errorDiv.style.background = 'rgba(255,165,0,0.2)';
                errorDiv.style.borderColor = '#ffa500';
                errorDiv.style.color = '#ffa500';
            } else {
                errorDiv.style.background = 'rgba(255,0,0,0.2)';
                errorDiv.style.borderColor = '#ff004f';
                errorDiv.style.color = '#ff6b6b';
            }
            setTimeout(() => {
                if (!isWarning) errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
